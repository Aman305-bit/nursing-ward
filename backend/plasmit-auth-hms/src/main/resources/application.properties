spring.application.name=plasmit-auth-hms
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/plasmit_hms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=YOUR_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

jwt.secret=CHANGE_THIS_TO_A_LONG_SECURE_SECRET_MINIMUM_256_BITS
jwt.access-token-expiration-ms=86400000
jwt.refresh-token-expiration-ms=604800000

auth.max-failed-attempts=5
auth.lock-duration-minutes=30
auth.password-expiry-days=90
auth.multi-device-login-enabled=true
auth.remember-me-days=30

logging.level.root=INFO
logging.level.com.plasmit.auth=DEBUG
logging.level.org.springframework.security=INFO
